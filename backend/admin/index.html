<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>goat admin</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0b; --panel: #151515; --line: #2c2c2c; --ink: #f2f2f2; --soft: #9a9a9a; --red: #ea1a0c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 20px; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; font-weight: 700; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 1px solid transparent; color: var(--soft); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
  nav button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 120px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: var(--soft); margin: 0 0 20px; }
  .row { display: grid; grid-template-columns: 170px 1fr auto; gap: 10px 14px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .row .id { color: var(--soft); font-family: ui-monospace, Consolas, monospace; font-size: 13px; padding-top: 8px; word-break: break-all; }
  input[type=text], input[type=number], input[type=password], textarea { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { min-height: 38px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  button.btn { background: var(--ink); color: #000; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  button.btn[disabled] { opacity: .5; cursor: progress; }
  .changed input, .changed textarea { border-color: var(--ink); }
  .langpick { display: flex; gap: 8px; margin: 14px 0; }
  .langpick [aria-pressed="true"] { border-color: var(--ink, currentColor); background: rgba(255,255,255,.1); }
  .row .id small.en { display: block; font-weight: 400; opacity: .6; margin-top: 4px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 20px; display: none; gap: 12px; align-items: center; justify-content: center; z-index: 6; }
  .bar.on { display: flex; }
  .toast { position: fixed; top: 64px; right: 20px; background: var(--ink); color: #000; padding: 10px 16px; border-radius: 8px; z-index: 9; max-width: 380px; }
  .toast.bad { background: var(--red); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; align-content: start; }
  .card h3 { margin: 0; font-size: 16px; }
  .card .pic { background: repeating-conic-gradient(#222 0 25%, #1a1a1a 0 50%) 0 0 / 16px 16px; border-radius: 8px; display: grid; place-items: center; min-height: 140px; overflow: hidden; }
  .card .pic img { max-width: 100%; max-height: 220px; display: block; }
  .card .pic.round img { border-radius: 50%; }
  .meta { color: var(--soft); font-size: 13px; }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fields label { display: grid; gap: 4px; font-size: 12px; color: var(--soft); }
  .login { max-width: 360px; margin: 18vh auto; display: grid; gap: 12px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--soft); font-weight: 400; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .row .id { padding-top: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
let KEY = sessionStorage.getItem("goat-admin-key") || "";
async function api(path, { method = "GET", json, form } = {}) {
  const res = await fetch(path, { method, headers: { "x-admin-key": KEY, ...(json ? { "Content-Type": "application/json" } : {}) }, body: json ? JSON.stringify(json) : form });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `error ${res.status}`);
  return data;
}
function toast(msg, bad) {
  const t = h("div", { class: `toast ${bad ? "bad" : ""}`, role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 2500);
}
const guard = (btn, fn) => async (...a) => { btn.disabled = true; try { await fn(...a); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; } };

/* ---------- login ---------- */
function login() {
  const input = h("input", { type: "password", placeholder: "admin key", "aria-label": "admin key", autocomplete: "current-password" });
  const err = h("p", { class: "hint", role: "alert" });
  const go = h("button", { class: "btn", type: "submit" }, "open");
  $("#app").replaceChildren(h("form", { class: "login", onsubmit: async (e) => {
    e.preventDefault();
    KEY = input.value;
    try { await api("/api/admin/check"); sessionStorage.setItem("goat-admin-key", KEY); shell(); } catch { err.textContent = "that key is not right"; }
  } }, h("h1", null, "goat admin"), input, go, err));
  input.focus();
}

/* ---------- shell ---------- */
const TABS = [["texts", "Words"], ["counters", "Numbers"], ["pictures", "Pictures"], ["circles", "Circles"], ["messages", "Messages"]];
function shell() {
  const body = h("main");
  const nav = h("nav", { role: "tablist" });
  const show = async (id) => {
    nav.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.id === id)));
    location.hash = id;
    body.replaceChildren(h("p", { class: "hint" }, "loading..."));
    try { body.replaceChildren(await VIEWS[id]()); } catch (e) { if (/key/.test(e.message)) return login(); body.replaceChildren(h("p", { role: "alert" }, e.message)); }
  };
  for (const [id, label] of TABS) nav.append(h("button", { role: "tab", "data-id": id, onclick: () => show(id) }, label));
  $("#app").replaceChildren(h("header", null, h("h1", null, "goat admin"), nav,
    h("a", { href: "/api", style: "color:var(--soft);margin-left:auto", target: "_blank" }, "api"),
    h("button", { class: "btn ghost", onclick: () => { sessionStorage.removeItem("goat-admin-key"); KEY = ""; login(); } }, "sign out")), body);
  show(TABS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : "texts");
}

/* ---------- words ---------- */
const WORD_LANGS = [["en", "English"], ["ar", "عربي"], ["ckb", "کوردی"]];
let WLANG = sessionStorage.getItem("goat-admin-lang") || "en";
async function textsView() {
  const L = WLANG;
  const [{ texts }, defaults, english] = await Promise.all([fetch(`/api/content?lang=${L}`).then((r) => r.json()), api(`/api/content/defaults?lang=${L}`), L === "en" ? null : fetch("/api/content?lang=en").then((r) => r.json())]);
  const picker = h("div", { class: "langpick", role: "group", "aria-label": "language of the words" }, WORD_LANGS.map(([code, label]) =>
    h("button", { type: "button", class: "btn ghost", "aria-pressed": String(code === L), onclick: () => { WLANG = code; sessionStorage.setItem("goat-admin-lang", code); show(); } }, label)));
  const dirty = new Map();
  const bar = h("div", { class: "bar" });
  const count = h("span");
  const save = h("button", { class: "btn" }, "save changes");
  const discard = h("button", { class: "btn ghost", onclick: () => show() }, "discard");
  const refresh = () => { bar.classList.toggle("on", dirty.size > 0); count.textContent = `${dirty.size} changed`; };
  bar.append(count, save, discard);
  const wrap = h("div");
  const rows = Object.keys(defaults).map((id) => {
    const long = defaults[id].length > 60 || defaults[id].includes("\n");
    const field = h(long ? "textarea" : "input", { type: long ? null : "text", "aria-label": id, rows: long ? 3 : null, dir: L === "en" ? "ltr" : "rtl" });
    field.value = texts[id];
    // for the other languages the English words are shown under the id, as the thing being translated
    const row = h("div", { class: "row" }, h("span", { class: "id" }, id, english ? h("small", { class: "en", dir: "ltr" }, english.texts[id]) : null), field);
    const reset = h("button", { class: "btn ghost", type: "button", title: "put the original words back", onclick: () => { field.value = defaults[id]; field.dispatchEvent(new Event("input")); } }, "original");
    row.append(reset);
    field.addEventListener("input", () => {
      if (field.value === texts[id]) dirty.delete(id); else dirty.set(id, field.value);
      row.classList.toggle("changed", dirty.has(id));
      refresh();
    });
    return row;
  });
  wrap.append(h("h2", null, "Words"), picker, h("p", { class: "hint" }, "Every word of the home page and the menu, buttons and form of the other pages, in the language chosen above. Change it, press save, reload the site. Long paragraphs wrap by themselves; keep a few words per label so they stay inside the page. \"original\" puts the first words back. The texts of the about, work and blog pages are in backend/data (about.json, work.json, blog.json and their .ar / .ckb versions)."), ...rows, bar);
  save.addEventListener("click", guard(save, async () => {
    await api(`/api/content?lang=${L}`, { method: "PUT", json: { texts: Object.fromEntries(dirty) } });
    toast(`saved ${dirty.size} change${dirty.size > 1 ? "s" : ""}`);
    show();
  }));
  const show = () => document.querySelector("nav [aria-selected=true]").click();
  return wrap;
}

/* ---------- numbers ---------- */
async function countersView() {
  const c = await fetch("/api/counters").then((r) => r.json());
  const inputs = Object.fromEntries(Object.keys(c).map((k) => [k, h("input", { type: "number", min: 0, max: 999, value: c[k], "aria-label": k })]));
  const save = h("button", { class: "btn" }, "save");
  save.addEventListener("click", guard(save, async () => {
    await api("/api/counters", { method: "PUT", json: Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, Number(el.value)])) });
    toast("saved");
  }));
  return h("div", null, h("h2", null, "Numbers"), h("p", { class: "hint" }, "The four counters at the end of the home page. The reels roll to these whole numbers (0 to 999). The labels under them are in Words."),
    ...Object.entries(inputs).map(([k, el]) => h("div", { class: "row" }, h("span", { class: "id" }, k), el, h("span"))), h("div", { style: "margin-top:16px" }, save));
}

/* ---------- pictures ---------- */
async function picturesView() {
  const items = await fetch("/api/media").then((r) => r.json());
  return h("div", null, h("h2", null, "Pictures"), h("p", { class: "hint" }, "The loose pictures and the sprite sheets. A new picture replaces the old one everywhere. Pictures for round places (the cans, the round logo) are cut to a centred square and given a round edge automatically, whatever shape you upload. A sprite sheet must keep the same grid (same columns, rows and cell size), because the animation picks one cell per moment."),
    h("div", { class: "grid" }, items.map((it) => {
      const img = h("img", { src: it.url, alt: it.label });
      const file = h("input", { type: "file", accept: it.kind === "sheet" ? "image/png,image/jpeg,image/webp" : "image/png,image/jpeg,image/webp,image/svg+xml", "aria-label": `new picture for ${it.key}` });
      const btn = h("button", { class: "btn" }, "replace");
      btn.addEventListener("click", guard(btn, async () => {
        if (!file.files[0]) throw new Error("choose a file first");
        const form = new FormData(); form.append("file", file.files[0]);
        const r = await api(`/api/media/${it.key}`, { method: "PUT", form });
        img.src = r.url; file.value = ""; toast("replaced");
      }));
      return h("div", { class: "card" }, h("h3", null, it.key), h("div", { class: "meta" }, it.label), h("div", { class: "pic" }, img), file, btn);
    })));
}

/* ---------- circles ---------- */
async function circlesView() {
  const clips = await fetch("/api/clips").then((r) => r.json());
  return h("div", null, h("h2", null, "Circles"),
    h("p", { class: "hint" }, "The moving pictures inside the circles. Upload a video (its frames are cut at the clip's fps, cropped to a square and scaled) or a set of pictures (taken in file-name order). \"t0 / t1\" are the seconds on the page's timeline when the circle appears and leaves (for the four work-scene circles can1 to can4 the movement is fixed: t0 / t1 say when the picture starts playing and stops, a video loops in between, and one picture just stays; for one picture use \"or pictures\"). \"Move the end to fit\" sets t1 to the end of the new footage; leave it off to keep the timing."),
    h("div", { class: "grid" }, Object.entries(clips).filter(([, c]) => c.kind === "frames" && !c.locked).map(([name, c]) => {
      const first = h("img", { src: c.frames[Math.floor(c.n / 2)], alt: `${name}, middle frame` });
      const meta = h("div", { class: "meta" });
      const setMeta = (m) => { meta.textContent = `${m.n} frames, ${m.fps} fps = ${(m.n / m.fps).toFixed(1)} s. on screen ${m.t0}s to ${m.t1}s`; };
      setMeta(c);
      const f = Object.fromEntries(["t0", "t1", "fps"].map((k) => [k, h("input", { type: "number", step: "any", value: c[k], "aria-label": `${name} ${k}` })]));
      const saveT = h("button", { class: "btn ghost" }, "save timing");
      saveT.addEventListener("click", guard(saveT, async () => {
        const m = await api(`/api/clips/${name}`, { method: "PUT", json: { t0: +f.t0.value, t1: +f.t1.value, fps: +f.fps.value } });
        setMeta(m); toast("saved");
      }));
      const video = h("input", { type: "file", accept: "video/*", "aria-label": `video for ${name}` });
      const pics = h("input", { type: "file", accept: "image/*", multiple: true, "aria-label": `pictures for ${name}` });
      const fit = h("input", { type: "checkbox", id: `fit-${name}` });
      const send = (label, input, path, field) => {
        const b = h("button", { class: "btn" }, label);
        b.addEventListener("click", guard(b, async () => {
          if (!input.files.length) throw new Error("choose a file first");
          const form = new FormData(); for (const file of input.files) form.append(field, file);
          b.textContent = "working...";
          try {
            const m = await api(`${path}${fit.checked ? "?fit=1" : ""}`, { method: "POST", form });
            setMeta(m); f.t1.value = m.t1; input.value = "";
            first.src = `/frames/${name}/${String(Math.floor(m.n / 2)).padStart(4, "0")}.jpg?v=${m.updatedAt}`;
            toast(`${name}: ${m.n} frames`);
          } finally { b.textContent = label; }
        }));
        return b;
      };
      return h("div", { class: "card" }, h("h3", null, name), c.label ? h("p", { class: "meta" }, c.label) : null, h("div", { class: "pic round" }, first), meta,
        h("div", { class: "fields" }, ["t0", "t1", "fps"].map((k) => h("label", null, k, f[k]))), saveT,
        h("label", { class: "meta" }, "video ", video), send("use this video", video, `/api/clips/${name}/video`, "file"),
        h("label", { class: "meta" }, "or pictures ", pics), send("use these pictures", pics, `/api/clips/${name}/frames`, "files"),
        h("label", { class: "meta" }, fit, " move the end to fit the new footage"));
    })));
}

/* ---------- messages ---------- */
async function messagesView() {
  const list = await api("/api/messages");
  return h("div", null, h("h2", null, "Messages"), h("p", { class: "hint" }, "Sent from the contact page."),
    list.length ? h("table", null, h("thead", null, h("tr", null, ["when", "who", "about", "message"].map((t) => h("th", null, t)))),
      h("tbody", null, [...list].reverse().map((m) => h("tr", null, h("td", null, new Date(m.receivedAt).toLocaleString()), h("td", null, `${m.name} <${m.email}>`), h("td", null, m.topic), h("td", { style: "white-space:pre-wrap" }, m.message)))))
      : h("p", { class: "meta" }, "nothing yet"));
}
const VIEWS = { texts: textsView, counters: countersView, pictures: picturesView, circles: circlesView, messages: messagesView };

if (KEY) api("/api/admin/check").then(shell, login); else login();
</script>
</body>
</html>
